name: CI

# Fast frontend checks on every change. The Windows Rust/Tauri build lives in rust.yml and only
# runs when the native host changes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match the vendored OpenAPI contract
        run: |
          pnpm api:generate
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error::src/api/schema.d.ts is stale. Run 'pnpm api:generate' and commit it."
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

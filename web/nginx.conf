# Web server of the browser client (ADR-0019). __CSP__ is replaced at image build time (web/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Inherited by the locations below as long as they add no headers of their own ("expires" does not count).
    add_header Content-Security-Policy "__CSP__" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), display-capture=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Hashed build assets never change.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: every other path loads the app, revalidated so updates arrive on reload.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}

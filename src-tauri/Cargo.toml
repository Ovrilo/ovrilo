[package]
name = "ovrilo"
version = "0.1.0"
description = "Ovrilo desktop client"
authors = ["Ovrilo"]
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "ovrilo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6.3", features = ["windows-native"] }
# Pinned Git revision (ADR-0001). Private repo: fetched with the git CLI (see .cargo/config.toml).
ovrilo-voice = { git = "https://github.com/Ovrilo/ovrilo-voice", rev = "9131ac2fd4c7963c0d6904c8838c0295bd512e04" }
ovrilo-voice-cpal = { git = "https://github.com/Ovrilo/ovrilo-voice", rev = "9131ac2fd4c7963c0d6904c8838c0295bd512e04" }
ovrilo-voice-livekit = { git = "https://github.com/Ovrilo/ovrilo-voice", rev = "9131ac2fd4c7963c0d6904c8838c0295bd512e04" }

# Real-time audio (ovrilo-voice, LiveKit, cpal) stutters when unoptimized; optimize all
# dependencies in dev builds while the app crate itself stays fast to rebuild.
[profile.dev.package."*"]
opt-level = 3

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

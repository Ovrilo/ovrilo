[package]
name = "ovrilo"
version = "0.3.0"
description = "Ovrilo desktop client"
authors = ["Ovrilo"]
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "ovrilo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6.3", features = ["windows-native"] }
# Pinned Git revision (ADR-0001). Private repo: fetched with the git CLI (see .cargo/config.toml).
ovrilo-voice = { git = "https://github.com/Ovrilo/ovrilo-voice", rev = "39c04e063e79cb54f873e066a748e81ffdca4d6d" }
ovrilo-voice-cpal = { git = "https://github.com/Ovrilo/ovrilo-voice", rev = "39c04e063e79cb54f873e066a748e81ffdca4d6d" }
ovrilo-voice-livekit = { git = "https://github.com/Ovrilo/ovrilo-voice", rev = "39c04e063e79cb54f873e066a748e81ffdca4d6d" }
tauri-plugin-updater = "=2.13.1"
tauri-plugin-process = "=2.4.0"

# Real-time audio (ovrilo-voice, LiveKit, cpal) stutters when unoptimized; optimize all
# dependencies in dev builds while the app crate itself stays fast to rebuild.
[profile.dev.package."*"]
opt-level = 3

# https://tauri.app/concept/size/#cargo-configuration
# Thin LTO with default codegen units: most of fat LTO's size and speed benefit at a fraction of the
# build time (release builds compile Tauri and LiveKit/WebRTC). Measure before going back to fat LTO.
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
# GetAsyncKeyState for the push-to-talk key (already in the dependency tree via Tauri).
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

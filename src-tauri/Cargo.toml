[package]
name = "ovrilo"
version = "0.1.0"
description = "Ovrilo desktop client"
authors = ["Ovrilo"]
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "ovrilo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6.3", features = ["windows-native"] }
# Pinned Git revision (ADR-0001). Private repo: fetched with the git CLI (see .cargo/config.toml).
ovrilo-voice = { git = "https://github.com/Ovrilo/ovrilo-voice", rev = "aae83303941010dd54584301b4a2a1a98a86f933" }
ovrilo-voice-cpal = { git = "https://github.com/Ovrilo/ovrilo-voice", rev = "aae83303941010dd54584301b4a2a1a98a86f933" }
ovrilo-voice-livekit = { git = "https://github.com/Ovrilo/ovrilo-voice", rev = "aae83303941010dd54584301b4a2a1a98a86f933" }

# Real-time audio (ovrilo-voice, LiveKit, cpal) stutters when unoptimized; optimize all
# dependencies in dev builds while the app crate itself stays fast to rebuild.
[profile.dev.package."*"]
opt-level = 3

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
# GetAsyncKeyState for the push-to-talk key (already in the dependency tree via Tauri).
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
